<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atomic Sparkle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1219">
<meta name="description" content="Atomic Sparkle — a table companion for AD&D 1st edition groups">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atomic Sparkle">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Atomic Sparkle: fantasy game HUD. Night stone, forged gold, ruby, sapphire and emerald gems. */
:root{--bg:#0a0910;--bg2:#13111b;--card:#17141f;--line:#3d3320;--hair:#2a2533;--text:#f3ecdc;--mute:#a39a8c;--gold:#e0b354;--gold2:#ffe29a;--vio:#7db4ff;--red:#ff5d5d;--green:#5fe0a0;--ruby:#c92a3a;--sapphire:#3f7be0;--ink:#241703;--r:16px;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--head:"Cinzel","Trajan Pro",Georgia,serif;--serif:var(--head);--sc:var(--head);--sans:"Alegreya Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 --goldgrad:linear-gradient(180deg,#fff0b8 0%,#f0c868 38%,#c8922e 70%,#8f6418 100%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100vh;height:100dvh}
html,body{margin:0;background:var(--bg);color:var(--text);font:17px/1.42 var(--sans);overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;display:flex;flex-direction:column;-webkit-text-size-adjust:100%;background:radial-gradient(90% 45% at 50% -5%,#3a1230 0%,transparent 70%),radial-gradient(70% 40% at 100% 100%,#14264a 0%,transparent 70%),radial-gradient(60% 35% at 0% 85%,#3a2408 0%,transparent 70%),#0a0910}
#app,#modal,#fx{position:relative;z-index:1}#fx{z-index:70}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
h1,h2,h3{font-family:var(--head);font-weight:700;margin:0;letter-spacing:.6px}
h3{font-size:17px;color:var(--gold2)}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.top{padding:calc(var(--st) + 10px) 14px 10px;display:flex;align-items:center;gap:11px;background:linear-gradient(180deg,#1d1626f2,#120f19f2);border-bottom:1px solid #000;box-shadow:inset 0 -1px 0 #e0b35466,0 6px 18px #000a;position:relative}
.top:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,#ffe29a,transparent);opacity:.7}
.top h1{font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f0cf7e}
.top .sub{font:500 13px var(--sans);color:#b9ad97;display:block;letter-spacing:0;-webkit-text-fill-color:#b9ad97}
.spark{width:34px;height:34px;flex:none;filter:drop-shadow(0 0 8px #e0b35488)}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 13px 26px}
.view.feedwrap{padding:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;margin:0 8px calc(8px + var(--sb));padding:5px 4px;border-radius:22px;background:linear-gradient(180deg,#221b2ef5,#120f19f5);border:1px solid #57461f;box-shadow:inset 0 1px 0 #ffe29a55,0 10px 26px #000c}
.tabs button{flex:1;padding:7px 2px 6px;font:700 10.5px var(--head);letter-spacing:.5px;color:#8b8274;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;border-radius:16px;transition:color .15s}
.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.tabs button.on{color:var(--gold2);background:radial-gradient(60% 80% at 50% 30%,#e0b35444,transparent 75%)}
.tabs button.on svg{transform:translateY(-2px) scale(1.14);filter:drop-shadow(0 0 7px #ffe29acc)}
.tabs .dot{position:absolute;top:5px;left:calc(50% + 9px);width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #17121f,0 0 8px #ff5d5d}
.card{position:relative;background:linear-gradient(180deg,#1c1826f2,#12101af2);border:1px solid #4d3f22;border-radius:var(--r);padding:16px 15px;margin-bottom:14px;box-shadow:inset 0 1px 0 #ffffff12,inset 0 0 26px #00000066,0 8px 22px #0009}
.card:before,.card:after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--gold);pointer-events:none;opacity:.9}
.card:before{top:-1px;left:-1px;border-right:0;border-bottom:0;border-radius:var(--r) 0 0 0}
.card:after{bottom:-1px;right:-1px;border-left:0;border-top:0;border-radius:0 0 var(--r) 0}
.card h2{font-size:15.5px;text-transform:uppercase;letter-spacing:1.4px;margin-bottom:11px;display:flex;align-items:center;gap:8px;color:var(--gold2)}
.card h2:before{content:"";width:7px;height:7px;background:var(--gold2);transform:rotate(45deg);box-shadow:0 0 8px #ffe29a;flex:none}
.card h2 .sp{flex:1}
.card h2 .btn,.card h2 .tag{text-transform:none;letter-spacing:0}
.mute{color:var(--mute)}.small{font-size:14px}.gold{color:var(--gold2)}.red{color:var(--red)}.green{color:var(--green)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{position:relative;overflow:hidden;background:var(--goldgrad);color:var(--ink);font:800 16px var(--sans);letter-spacing:.2px;border-radius:12px;padding:12px 16px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #5c400f;box-shadow:inset 0 1px 0 #fff9,inset 0 -2px 0 #0003,0 3px 0 #4a3209,0 8px 16px #0009;text-shadow:0 1px 0 #fff5;transition:transform .07s,box-shadow .07s}
.btn:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,#fff8,transparent);transform:skewX(-20deg);transition:left .45s}
.btn:active{transform:translateY(3px);box-shadow:inset 0 1px 0 #fff6,0 0 0 #4a3209,0 2px 6px #0009}
.btn:active:after{left:130%}
.btn.sec{background:linear-gradient(180deg,#2e2740,#1c1728);color:var(--text);border:1px solid #6a5730;box-shadow:inset 0 1px 0 #ffffff22,0 3px 0 #0a0810,0 8px 14px #0008;text-shadow:none}
.btn.ghost{background:none;color:var(--gold2);padding:8px 10px;min-height:38px;border:0;box-shadow:none;text-shadow:none}.btn.ghost:after{display:none}
.btn.sm{padding:7px 12px;min-height:38px;font-size:15px;border-radius:10px}
.btn.danger{background:linear-gradient(180deg,#ef4b5b,#b01f30 60%,#7a1220);color:#fff;border:1px solid #4a0a13;box-shadow:inset 0 1px 0 #fff6,0 3px 0 #3a0810,0 8px 14px #0008;text-shadow:0 1px 0 #0006}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.4;filter:saturate(.4)}
input,select,textarea{background:#0b0a11;border:1px solid #3c3449;border-radius:12px;padding:11px 12px;width:100%;min-height:46px;outline:none;box-shadow:inset 0 2px 6px #000c}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:inset 0 2px 6px #000c,0 0 0 3px #e0b35433}
input::placeholder,textarea::placeholder{color:#6f6878}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;color:var(--mute);margin:11px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:6px 13px;border-radius:99px;border:1px solid #3c3449;font:700 14px var(--sans);background:#16131f;color:var(--mute);white-space:nowrap}
.pill.on{background:var(--goldgrad);color:var(--ink);border-color:#5c400f;box-shadow:0 0 12px #e0b35466}
.pills{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;flex:none}.pills::-webkit-scrollbar{display:none}
.hud{display:flex;gap:10px;overflow-x:auto;padding:10px 12px 4px;scrollbar-width:none;flex:none}.hud::-webkit-scrollbar{display:none}.hud:empty{display:none}
.hudc{display:flex;flex-direction:column;align-items:center;gap:3px;width:66px;flex:none}
.hudc b{font:700 12.5px var(--sans);max-width:66px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hudc small{font-size:11.5px;color:var(--mute)}
.ring{--p:100;--c:#5fe0a0;width:56px;height:56px;border-radius:50%;padding:3px;background:conic-gradient(var(--c) calc(var(--p)*1%),#2a2533 0);box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent);display:flex}
.ring .av{width:100%;height:100%;border-width:2px;border-color:#0a0910;box-shadow:none}
.ring.low{--c:#ff5d5d;animation:pulse 1.2s ease-in-out infinite}.ring.mid{--c:#ffc24a}.ring.dead{--c:#555;filter:grayscale(1)}
@keyframes pulse{50%{box-shadow:0 0 20px #ff5d5dcc}}
.feed{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 12px 10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:9px 13px;border-radius:6px 16px 16px 16px;background:linear-gradient(180deg,#221d2e,#18141f);border:1px solid #3c3449;align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 4px 12px #0008;animation:pop .22s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.92) translateY(8px);opacity:0}}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,#8e2231,#5c1220);border-color:#3a0810;border-radius:16px 6px 16px 16px;box-shadow:inset 0 1px 0 #ffffff26,0 4px 12px #0008}
.msg .who{font:700 13px var(--sans);color:var(--gold2);margin-bottom:2px}
.msg .when{font:400 11px var(--sans);color:var(--mute);margin-left:6px}
.msg.roll{background:linear-gradient(180deg,#1b2440,#10162a);border-color:#3f5fae;box-shadow:inset 0 1px 0 #7db4ff44,0 0 18px #3f7be044,0 4px 12px #0008;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;border-radius:14px}
.msg.roll .who{grid-column:1/-1}
.rollbadge{grid-row:span 3;min-width:62px;height:62px;padding:0 8px;display:flex;align-items:center;justify-content:center;font:900 26px var(--head);color:#fff;background:linear-gradient(160deg,#5b8ff0,#2a4fa8);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);text-shadow:0 2px 0 #0006;animation:spin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes spin{from{transform:rotate(-200deg) scale(.3);opacity:0}}
.msg.roll.crit{border-color:var(--gold);box-shadow:0 0 26px #ffe29a88}.msg.roll.crit .rollbadge{background:var(--goldgrad);color:var(--ink);text-shadow:0 1px 0 #fff8}
.msg.roll.fumble{border-color:#7a1220}.msg.roll.fumble .rollbadge{background:linear-gradient(160deg,#ef4b5b,#7a1220)}
.msg.roll .tot{font:700 15px var(--sans);color:#cfe0ff}
.msg.roll .dice{font-size:13px;color:#8fa6d6}
.msg.ev{align-self:center;background:none;border:0;color:#b9ad97;font:500 14px var(--sans);text-align:center;padding:2px 10px;max-width:100%;box-shadow:none;animation:none}
.msg.ev:before{content:"◆ ";color:var(--gold);font-size:9px;vertical-align:2px}
.msg.priv{border-style:dashed}
.composer{display:flex;gap:8px;padding:8px 10px;background:transparent;align-items:flex-end}
.composer textarea{min-height:46px;height:46px;max-height:120px;border-radius:23px;padding:11px 15px;resize:none}
.icb{width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,#2e2740,#1c1728);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid #6a5730;box-shadow:0 3px 0 #0a0810,0 6px 12px #0008}
.icb:active{transform:translateY(2px)}
.icb.go{background:var(--goldgrad);border-color:#5c400f;color:var(--ink);box-shadow:0 3px 0 #4a3209,0 0 14px #e0b35466}
.icb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sheet-bg{position:fixed;inset:0;background:rgba(5,4,9,.74);z-index:20;display:flex;align-items:flex-end;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.sheet{background:linear-gradient(180deg,#201a2c,#120f19);border-radius:24px 24px 0 0;border:1px solid #6a5730;border-bottom:0;width:100%;max-height:92%;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 #ffe29a88,0 -14px 50px #000c;animation:rise .22s cubic-bezier(.2,1,.3,1)}
@keyframes rise{from{transform:translateY(40px);opacity:.3}}
.sheet .sh{padding:16px 16px 11px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--hair)}
.sheet .sh h2{flex:1;font-size:17px;text-transform:uppercase;letter-spacing:1.2px;color:var(--gold2)}
.sheet .sbody{padding:14px 16px calc(18px + var(--sb));overflow-y:auto;-webkit-overflow-scrolling:touch}
.x{width:36px;height:36px;border-radius:50%;background:#2a2338;border:1px solid #4d4460;font-size:16px;color:var(--mute)}
.stat{position:relative;background:radial-gradient(120% 90% at 50% 0%,#3a2d55 0%,#1a1525 62%);border:1px solid #5d4d86;border-radius:14px;padding:9px 6px 8px;text-align:center;box-shadow:inset 0 1px 0 #ffffff26,0 4px 10px #0008}
.stat b{display:block;font:900 26px/1.1 var(--head);color:#fff;text-shadow:0 0 14px #b79cff99}
.stat span{font:700 11px var(--head);color:#c9b9f0;letter-spacing:1px;text-transform:uppercase}
.stat small{display:block;font-size:12px;color:#b3a9c9;margin-top:2px;line-height:1.25}
.grid3>.stat:nth-child(1){background:radial-gradient(120% 90% at 50% 0%,#5a1f2a 0%,#1f1218 62%);border-color:#96404d}.grid3>.stat:nth-child(1) b{text-shadow:0 0 14px #ff7a8a99}
.grid3>.stat:nth-child(2){background:radial-gradient(120% 90% at 50% 0%,#1f3a66 0%,#121826 62%);border-color:#4a70b8}.grid3>.stat:nth-child(2) b{text-shadow:0 0 14px #7db4ff99}
.grid3>.stat:nth-child(3){background:radial-gradient(120% 90% at 50% 0%,#1f4a3a 0%,#11201a 62%);border-color:#3f9a78}.grid3>.stat:nth-child(3) b{text-shadow:0 0 14px #5fe0a099}
.grid3>.stat:nth-child(4){background:radial-gradient(120% 90% at 50% 0%,#5a4414 0%,#1f1a10 62%);border-color:#a8853a}.grid3>.stat:nth-child(4) b{text-shadow:0 0 14px #ffe29a99}
.grid3>.stat:nth-child(5){background:radial-gradient(120% 90% at 50% 0%,#5a2c14 0%,#1f1510 62%);border-color:#b06a3a}.grid3>.stat:nth-child(5) b{text-shadow:0 0 14px #ffa86a99}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:16px}.kv:last-child{border:0}
.kv span:first-child{color:var(--mute)}.kv span:last-child{text-align:right}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair)}.li:last-child{border:0}
.li .t{flex:1;min-width:0}.li .t small{display:block;color:var(--mute);font-size:14px}
.bar{height:12px;border-radius:9px;background:#0a0910;overflow:hidden;border:1px solid #3c3449;position:relative;box-shadow:inset 0 2px 4px #000}
.bar i{display:block;height:100%;background:linear-gradient(180deg,#ffe29a,#e0b354 50%,#a8781f);position:relative;border-radius:9px;transition:width .5s cubic-bezier(.2,1,.3,1)}
.bar i:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff9 50%,transparent 70%);background-size:200% 100%;animation:shimmer 2.4s linear infinite}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.bar.hp i{background:linear-gradient(180deg,#ff8a8a,#e23b4c 50%,#96182a)}
.step{display:flex;align-items:center;gap:6px}.step button{width:44px;height:44px;border-radius:12px;background:linear-gradient(180deg,#2e2740,#1c1728);border:1px solid #6a5730;font-size:21px;box-shadow:0 3px 0 #0a0810}
.step b{min-width:46px;text-align:center;font:900 24px var(--head);color:var(--gold2)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.die{background:linear-gradient(160deg,#2e2740,#191422);border:1px solid #5d4d86;border-radius:14px;padding:15px 0;font:900 18px var(--head);color:var(--text);box-shadow:0 3px 0 #0a0810}
.die.on{background:linear-gradient(160deg,#5b8ff0,#2a4fa8);color:#fff;border-color:#9dc0ff;box-shadow:0 0 18px #3f7be0aa,0 3px 0 #14264a}
.toast{position:fixed;left:50%;top:calc(var(--st) + 12px);transform:translateX(-50%);background:linear-gradient(180deg,#2a2338,#17131f);border:1px solid var(--gold);color:var(--text);padding:11px 18px;border-radius:14px;z-index:60;max-width:90%;font:700 15.5px var(--sans);box-shadow:0 0 22px #e0b35455,0 12px 30px #000c;animation:drop .25s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{from{transform:translate(-50%,-30px);opacity:0}}
.toast.err{border-color:var(--red);box-shadow:0 0 22px #ff5d5d55,0 12px 30px #000c}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 24px) 22px 30px;overflow-y:auto}
.hero{text-align:center;margin-bottom:22px}.hero svg{width:96px;height:96px;filter:drop-shadow(0 0 22px #e0b35488);animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.hero h1{font-size:34px;font-weight:900;margin-top:8px;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#b9ad97;margin:6px 0 0;font-size:17px}
.code{font:900 32px var(--head);letter-spacing:8px;background:var(--goldgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
details{border-top:1px solid var(--hair);padding:10px 0}details:first-of-type{border:0}summary{font-weight:700;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"+";float:right;color:var(--gold);font-weight:800}details[open] summary:after{content:"–"}
details p,details ul{margin:6px 0 0;color:#ddd3c0;font-size:16px}ul{padding-left:18px}li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:6px 4px;border-bottom:1px solid var(--hair);text-align:center}th{color:var(--mute);font-weight:500}td:first-child,th:first-child{text-align:left}
.av{width:44px;height:44px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 30%,#8e2231,#2a0f18);border:2px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;flex:none;font:700 16px var(--head);color:var(--gold2);padding:0;box-shadow:0 0 0 2px #0a0910,0 0 10px #e0b35455}.av.big{width:76px;height:76px;font-size:26px}.av img{width:100%;height:100%;object-fit:cover;display:block}
.av[class*="kg-"]{border:3px solid transparent;background:radial-gradient(circle at 35% 30%,#3a2d55,#120f19) padding-box,var(--fr,var(--gold)) border-box;box-shadow:0 0 0 2px #0a0910,0 0 12px var(--fg,#e0b35455)}
.av.kg-fighter{--fr:repeating-conic-gradient(#e6e9f0 0 10deg,#b01f30 10deg 30deg);--fg:#ef4b5b77}
.av.kg-cleric{--fr:repeating-conic-gradient(#fffbe6 0 7deg,#e0b354 7deg 22.5deg);--fg:#ffe29a88}
.av.kg-magicuser{--fr:conic-gradient(#3f7be0,#b79cff,#5fe0ff,#b79cff,#3f7be0);--fg:#7db4ff88}
.av.kg-thief{--fr:repeating-conic-gradient(#0f2a1c 0 18deg,#5fe0a0 18deg 24deg);--fg:#5fe0a066}
.av.kg-monk{--fr:conic-gradient(#b79cff,#5d3a8a,#b79cff,#5d3a8a,#b79cff);--fg:#b79cff66}
.av.k-dwarf{--fr:linear-gradient(135deg,#ffc27a,#8a4a1a 45%,#ffc27a 55%,#6a3410);--fg:#f0a85a77;border-radius:30%}
.av.k-elf{--fr:conic-gradient(#e8fff0,#5fe0a0,#e6e6f5,#5fe0a0,#e8fff0);--fg:#5fe0a077;border-radius:50% 14% 50% 14%}
.av.k-halfling{--fr:repeating-conic-gradient(#d9954a 0 30deg,#8fbf6a 30deg 60deg);--fg:#d9954a66;border-radius:42%}
.ring .av[class*="kg-"]{border-width:3px;border-color:transparent;box-shadow:none}
