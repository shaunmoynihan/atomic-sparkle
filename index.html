<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atomic Sparkle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#3a1415">
<meta name="description" content="Atomic Sparkle — a table companion for AD&D 1st edition groups">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atomic Sparkle">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Atomic Sparkle: leather, vellum, brass and map-blue, after the 1981 Basic box */
:root{--bg:#150e0d;--bg2:#1d1412;--card:#231816;--line:#4a3620;--hair:#3a2a1c;--text:#eddcb9;--mute:#b09a78;--gold:#cfa84f;--gold2:#f2d88f;--vio:#7fb2d4;--red:#d9584c;--green:#93b56e;--ox:#6a1d1e;--vellum:#ead9b5;--ink:#2a1a12;--blue:#6fa3c7;--r:10px;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--serif:"IM Fell English","Iowan Old Style",Palatino,Georgia,serif;--sc:"IM Fell English SC","IM Fell English",Georgia,serif;--sans:"Alegreya Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:17px/1.42 var(--sans);overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;-webkit-text-size-adjust:100%;background:radial-gradient(120% 70% at 50% 0%,#2a1a16 0%,#150e0d 60%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .4 0 0 0 0 .3 0 0 0 .55 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");z-index:0}
#app,#modal{position:relative;z-index:1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;letter-spacing:.2px}
h3{font-family:var(--sc);font-size:19px;color:var(--gold2)}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.top{padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#3a1415,#241211);border-bottom:1px solid #000;box-shadow:inset 0 -1px 0 rgba(207,168,79,.45),0 2px 10px #0008}
.top h1{font-size:22px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold2);text-shadow:0 1px 0 #000}
.top .sub{font-size:13px;color:#d2b98c;font-family:var(--sans);display:block;font-weight:400;letter-spacing:0}
.spark{width:30px;height:30px;flex:none;filter:drop-shadow(0 1px 2px #000)}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
.view.feedwrap{padding:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;background:linear-gradient(180deg,#261a17,#170f0e);padding-bottom:var(--sb);border-top:1px solid #000;box-shadow:inset 0 1px 0 rgba(207,168,79,.4)}
.tabs button{flex:1;padding:10px 2px 8px;font-size:12px;color:#9c8766;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;font-family:var(--sc);letter-spacing:.3px}
.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--gold2)}
.tabs button.on:before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;background:var(--gold2);transform:translateX(-50%) rotate(45deg);box-shadow:0 0 8px #f2d88f99}
.tabs .dot{position:absolute;top:7px;left:calc(50% + 9px);width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px #1d1412}
.card{background:linear-gradient(180deg,#281b18,#1f1513);border:1px solid var(--line);border-radius:var(--r);padding:16px 15px;margin-bottom:14px;box-shadow:inset 0 0 0 3px #1c1311,inset 0 0 0 4px rgba(207,168,79,.2),0 6px 16px #0006}
.card h2{font-size:20px;margin-bottom:10px;padding-bottom:7px;display:flex;align-items:center;gap:8px;color:var(--gold2);border-bottom:1px solid transparent;border-image:linear-gradient(90deg,rgba(207,168,79,.7),rgba(207,168,79,0)) 1}
.card h2 .sp{flex:1}
.mute{color:var(--mute)}.small{font-size:14px}.gold{color:var(--gold2)}.red{color:var(--red)}.green{color:var(--green)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{background:linear-gradient(180deg,#ecd08a,#c79a3f 55%,#a87c2c);color:var(--ink);font-weight:700;border-radius:8px;padding:12px 16px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #6e5120;box-shadow:inset 0 1px 0 #fff6,0 2px 0 #3b2a10,0 4px 10px #0007;text-shadow:0 1px 0 #fff4;transition:transform .06s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff4,0 0 0 #3b2a10}
.btn.sec{background:linear-gradient(180deg,#3a2822,#2a1c18);color:var(--text);border:1px solid #6b5230;box-shadow:inset 0 1px 0 #ffffff14,0 2px 0 #0d0807;text-shadow:none}
.btn.ghost{background:none;color:var(--gold2);padding:8px 10px;min-height:38px;border:0;box-shadow:none;text-shadow:none}
.btn.sm{padding:7px 12px;min-height:38px;font-size:15px;border-radius:7px}
.btn.danger{background:linear-gradient(180deg,#8a2a26,#5c1a1b);color:#ffd9cf;border:1px solid #2e0c0c;box-shadow:inset 0 1px 0 #ffffff22,0 2px 0 #1d0707;text-shadow:none}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.4;filter:saturate(.5)}
input,select,textarea{background:#120c0b;border:1px solid var(--line);border-radius:8px;padding:11px 12px;width:100%;min-height:46px;outline:none;box-shadow:inset 0 2px 5px #0009}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input::placeholder,textarea::placeholder{color:#7d6c53}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;color:var(--mute);margin:11px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);font-size:14px;background:#1a1210;color:var(--mute);white-space:nowrap}
.pill.on{background:linear-gradient(180deg,#ecd08a,#c79a3f);color:var(--ink);border-color:#6e5120;font-weight:700}
.pills{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;flex:none}.pills::-webkit-scrollbar{display:none}
.feed{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 12px 10px;display:flex;flex-direction:column;gap:7px}
.msg{max-width:86%;padding:8px 12px;border-radius:4px 14px 14px 14px;background:#2a1d19;border:1px solid var(--line);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:0 2px 6px #0005}
.msg.me{align-self:flex-end;background:linear-gradient(180deg,#6a1d1e,#521516);border-color:#2e0c0c;border-radius:14px 4px 14px 14px}
.msg .who{font-size:13px;color:var(--gold2);font-family:var(--sc);margin-bottom:1px}
.msg .when{font-size:11px;color:var(--mute);margin-left:6px;font-family:var(--sans)}
.msg.roll{background-color:#dfe9ee;color:#1d3345;border-color:#8fb0c6;background-image:linear-gradient(#9ec1d955 1px,transparent 1px),linear-gradient(90deg,#9ec1d955 1px,transparent 1px);background-size:14px 14px;border-radius:4px}
.msg.roll .who{color:#7a2420}.msg.roll .when,.msg.roll .mute{color:#5d7688}
.msg.roll .tot{font:400 30px/1.1 var(--serif);color:#7a2420}
.msg.roll .dice{font-size:13px;color:#4b677a}
.msg.roll .tag{background:#c9d9e3;color:#3a5568}
.msg.ev{align-self:center;background:none;border:0;color:var(--mute);font:italic 15px var(--serif);text-align:center;padding:2px 8px;max-width:100%;box-shadow:none}
.msg.priv{border-style:dashed}
.composer{display:flex;gap:8px;padding:8px 10px;border-top:1px solid #000;background:#1d1412;align-items:flex-end;box-shadow:inset 0 1px 0 rgba(207,168,79,.25)}
.composer textarea{min-height:44px;height:44px;max-height:120px;border-radius:22px;padding:10px 14px;resize:none}
.icb{width:44px;height:44px;border-radius:50%;background:linear-gradient(180deg,#3a2822,#2a1c18);display:flex;align-items:center;justify-content:center;flex:none;border:1px solid #6b5230}
.icb.go{background:linear-gradient(180deg,#ecd08a,#b88a34);border-color:#6e5120;color:var(--ink)}
.icb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet-bg{position:fixed;inset:0;background:rgba(8,4,3,.72);z-index:20;display:flex;align-items:flex-end;backdrop-filter:blur(2px)}
.sheet{background:linear-gradient(180deg,#2a1c19,#1d1412);border-radius:16px 16px 0 0;border:1px solid var(--line);border-bottom:0;width:100%;max-height:92%;display:flex;flex-direction:column;box-shadow:inset 0 1px 0 rgba(242,216,143,.5),0 -10px 40px #000a;animation:rise .18s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet .sh{padding:14px 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--hair)}
.sheet .sh h2{flex:1;font-size:21px;color:var(--gold2)}
.sheet .sbody{padding:14px 16px calc(18px + var(--sb));overflow-y:auto;-webkit-overflow-scrolling:touch}
.x{width:36px;height:36px;border-radius:50%;background:#33231e;border:1px solid var(--line);font-size:17px;color:var(--mute)}
.stat{background:linear-gradient(180deg,#f0e2c2,#dcc89d);border:1px solid #8a6f3e;border-radius:6px;padding:8px 6px;text-align:center;color:var(--ink);box-shadow:inset 0 0 0 2px #f6ecd4,inset 0 0 12px #b9964f55,0 2px 5px #0006}
.stat b{display:block;font:400 26px/1.1 var(--serif);color:#3a1210}
.stat span{font:14px var(--sc);color:#6b4f25;letter-spacing:.4px}
.stat small{display:block;font-size:12px;color:#5d4a2c;margin-top:2px;line-height:1.25}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--hair);font-size:16px}.kv:last-child{border:0}
.kv span:first-child{color:var(--mute)}.kv span:last-child{text-align:right}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair)}.li:last-child{border:0}
.li .t{flex:1;min-width:0}.li .t small{display:block;color:var(--mute);font-size:14px}
.bar{height:9px;border-radius:9px;background:#0f0a09;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,#a87c2c,#f2d88f)}
.bar.hp i{background:linear-gradient(90deg,#7a1d1b,#d9584c)}
.step{display:flex;align-items:center;gap:6px}.step button{width:42px;height:42px;border-radius:8px;background:linear-gradient(180deg,#3a2822,#2a1c18);border:1px solid #6b5230;font-size:20px}
.step b{min-width:44px;text-align:center;font:400 24px var(--serif);color:var(--gold2)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.die{background:linear-gradient(180deg,#3a2822,#2a1c18);border:1px solid #6b5230;border-radius:8px;padding:14px 0;font:400 20px var(--serif);color:var(--text)}
.die.on{background:linear-gradient(180deg,#8a2a26,#5c1a1b);color:#ffe9c9;border-color:#2e0c0c;box-shadow:0 0 0 2px #cfa84f88}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);background:linear-gradient(180deg,#f0e2c2,#dcc89d);border:1px solid #8a6f3e;color:var(--ink);padding:10px 16px;border-radius:6px;z-index:60;max-width:90%;font-size:16px;font-weight:500;box-shadow:0 10px 30px #000c}
.toast.err{border-color:#7a1d1b;box-shadow:0 0 0 2px #a8322d,0 10px 30px #000c}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 24px) 22px 30px;overflow-y:auto}
.hero{text-align:center;margin-bottom:22px}.hero svg{width:84px;height:84px;filter:drop-shadow(0 4px 14px #cfa84f55)}.hero h1{font-size:40px;margin-top:6px;color:var(--gold2);text-shadow:0 2px 0 #000}.hero p{color:var(--mute);margin:4px 0 0;font:italic 18px var(--serif)}
.code{font:400 34px var(--sc);letter-spacing:7px;color:var(--gold2)}
details{border-top:1px solid var(--hair);padding:9px 0}details:first-of-type{border:0}summary{font-weight:700;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"+";float:right;color:var(--gold)}details[open] summary:after{content:"–"}
details p,details ul{margin:6px 0 0;color:#e0cfa9;font-size:16px}ul{padding-left:18px}li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 4px;border-bottom:1px solid var(--hair);text-align:center}th{color:var(--mute);font-weight:500}td:first-child,th:first-child{text-align:left}
.av{width:44px;height:44px;border-radius:50%;overflow:hidden;background:radial-gradient(circle at 35% 30%,#5c1a1b,#2a1211);border:2px solid var(--gold);display:inline-flex;align-items:center;justify-content:center;flex:none;font:400 18px var(--sc);color:var(--gold2);padding:0;box-shadow:0 0 0 2px #1c1311,0 2px 6px #0008}.av.big{width:76px;height:76px;font-size:28px}.av img{width:100%;height:100%;object-fit:cover;display:block}
.sesbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#1a1210;border-bottom:1px solid #000;box-shadow:inset 0 -1px 0 var(--hair)}.sesbar b{font-family:var(--sc);font-weight:400;font-size:17px;color:#c9b48c}.sesbar small{display:block;color:var(--mute);font-size:13px}.sesbar.live{background:linear-gradient(90deg,#3b2a12,#1f1610)}.sesbar.live b{color:var(--gold2);text-shadow:0 0 12px #f2d88f66}
.tag{font-size:12px;padding:2px 7px;border-radius:4px;background:#33231e;color:var(--mute);margin-left:6px;font-family:var(--sans)}
.tag.dm{background:linear-gradient(180deg,#8a2a26,#5c1a1b);color:#ffe2b8}
.empty{text-align:center;color:var(--mute);padding:26px 10px;font:italic 17px var(--serif)}
.warn{background:#3a2412;border:1px solid #7a5a1f;color:#f2d88f;border-radius:8px;padding:9px 12px;font-size:15px;margin:8px 0}
.sndbtn{width:38px;height:38px;border-radius:50%;border:1px solid #6b5230;background:#2a1c18;display:flex;align-items:center;justify-content:center;color:#9c8766;flex:none}.sndbtn.on{color:var(--gold2);box-shadow:0 0 10px #f2d88f55}.sndbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.scene{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.scene button{padding:10px 4px;border-radius:8px;border:1px solid #6b5230;background:linear-gradient(180deg,#3a2822,#2a1c18);font-size:14px;color:var(--text)}.scene button.on{background:linear-gradient(180deg,#ecd08a,#c79a3f);color:var(--ink);font-weight:700;border-color:#6e5120}
/* hero card */
.hc-bg{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 40%,#3a1415ee,#080403f5);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;perspective:1100px;touch-action:none}
.hc{width:min(84vw,340px);aspect-ratio:5/7.4;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform:rotateX(var(--rx,0deg)) rotateY(calc(var(--ry,0deg) + var(--flip,0deg)));animation:deal .5s cubic-bezier(.2,.9,.3,1.2)}
.hc.drag{transition:none}
@keyframes deal{from{transform:translateY(60px) rotateZ(-8deg) scale(.8);opacity:0}}
.hc-face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;box-shadow:0 24px 50px #000c,0 0 0 1px #000}
.hc-front{background:linear-gradient(160deg,#f3e6c6,#d9c391 70%,#c4a96f);color:var(--ink);padding:14px;display:flex;flex-direction:column}
.hc-front:before{content:"";position:absolute;inset:7px;border:2px solid var(--hc,#6a1d1e);border-radius:11px;box-shadow:inset 0 0 0 3px #f3e6c6,inset 0 0 0 4px #8a6f3e;pointer-events:none}
.hc-shine{position:absolute;inset:0;border-radius:16px;pointer-events:none;background:radial-gradient(circle at var(--mx,30%) var(--my,20%),#ffffffaa 0%,#fff3 18%,transparent 45%),linear-gradient(115deg,transparent 30%,#ffd7f044 45%,#c9f3ff44 55%,transparent 70%);mix-blend-mode:soft-light;opacity:var(--sh,.55)}
.hc-top{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px 0;font:16px var(--sc);color:var(--hc,#6a1d1e);position:relative}
.hc-port{margin:8px auto 0;width:66%;aspect-ratio:1/1.12;border-radius:50% 50% 8px 8px/38% 38% 8px 8px;overflow:hidden;border:3px solid var(--hc,#6a1d1e);box-shadow:0 0 0 2px #f3e6c6,0 0 0 3px #8a6f3e,0 6px 14px #0006;background:radial-gradient(circle at 40% 30%,var(--hc,#6a1d1e),#1d1110);display:flex;align-items:center;justify-content:center;font:400 64px var(--sc);color:#f2d88f;position:relative}
.hc-port img{width:100%;height:100%;object-fit:cover}
.hc-name{margin:-16px auto 0;position:relative;background:linear-gradient(180deg,var(--hc,#6a1d1e),#2a0d0d);color:#ffeccd;font:400 22px/1.15 var(--serif);padding:6px 18px;border-radius:4px;max-width:92%;text-align:center;box-shadow:0 3px 8px #0008,inset 0 0 0 1px #f2d88f88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-sub{text-align:center;font:italic 16px var(--serif);color:#4d351c;margin-top:7px;position:relative}
.hc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 8px 0;position:relative}
.hc-stats div{text-align:center;border:1px solid #8a6f3e;border-radius:6px;background:#f6ecd4aa;padding:3px 0}.hc-stats b{display:block;font:400 22px/1.1 var(--serif);color:#3a1210}.hc-stats span{font:12px var(--sc);color:#6b4f25}
.hc-ab{display:flex;justify-content:space-between;margin:8px 8px 0;position:relative}
.hc-ab div{width:15%;text-align:center}.hc-ab b{display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7,transparent 60%),var(--hc,#6a1d1e);color:#ffeccd;font:400 17px var(--serif);border:1px solid #2a0d0d;box-shadow:0 2px 4px #0006}.hc-ab span{font:11px var(--sc);color:#6b4f25}
.hc-foot{margin-top:auto;display:flex;justify-content:space-between;padding:0 10px 6px;font:13px var(--sc);color:#6b4f25;position:relative}
.hc-hp{margin:8px 8px 0;height:10px;border-radius:9px;background:#b9a57a;border:1px solid #8a6f3e;overflow:hidden;position:relative}.hc-hp i{display:block;height:100%;background:linear-gradient(90deg,#7a1d1b,#d9584c)}
.hc-back{transform:rotateY(180deg);background:linear-gradient(160deg,#2c1d19,#170f0e);color:var(--text);padding:18px 16px;display:flex;flex-direction:column;gap:2px}
.hc-back:before{content:"";position:absolute;inset:7px;border:1px solid var(--gold);border-radius:11px;box-shadow:inset 0 0 0 3px #1c1311,inset 0 0 0 4px #cfa84f55;pointer-events:none}
.hc-back h3{text-align:center;margin-bottom:6px}.hc-back .kv{font-size:15px;padding:5px 2px}.hc-back .sc{overflow-y:auto;position:relative;flex:1}
.hc-hint{color:#d2b98c;font:italic 16px var(--serif)}
@media (prefers-reduced-motion:reduce){.hc,.sheet{animation:none}.hc{transition:none}}
@media (min-width:700px){#app{max-width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
