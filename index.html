<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atomic Sparkle</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#14121c">
<meta name="description" content="Atomic Sparkle — a table companion for AD&D 1st edition groups">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Atomic Sparkle">
<style>
:root{--bg:#14121c;--bg2:#1c1929;--card:#231f33;--line:#352f4b;--text:#efeaf7;--mute:#a59dbd;--gold:#f5b942;--gold2:#ffd98a;--vio:#9a8cff;--red:#ff6b6b;--green:#5fd39a;--r:14px;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0;display:flex;flex-direction:column;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:.2px}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.top{padding:calc(var(--st) + 10px) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1f1b30,var(--bg))}
.top h1{font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--mute);font-family:inherit;display:block;font-weight:400}
.spark{width:26px;height:26px;flex:none}
.view{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px}
.view.feedwrap{padding:0;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-top:1px solid var(--line);background:#191626;padding-bottom:var(--sb)}
.tabs button{flex:1;padding:9px 2px 8px;font-size:11px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--gold)}
.tabs .dot{position:absolute;top:6px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:17px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.mute{color:var(--mute)}.small{font-size:13px}.gold{color:var(--gold)}.red{color:var(--red)}.green{color:var(--green)}
.row{display:flex;gap:8px;align-items:center}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.btn{background:var(--gold);color:#221a05;font-weight:650;border-radius:12px;padding:12px 16px;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.sec{background:#2e2944;color:var(--text);border:1px solid var(--line)}
.btn.ghost{background:none;color:var(--gold);padding:8px 10px;min-height:38px}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.danger{background:#40202a;color:#ffb3b3;border:1px solid #6a2f3c}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45}
input,select,textarea{background:#16131f;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:46px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:#1a1727;color:var(--mute);white-space:nowrap}
.pill.on{background:var(--gold);color:#221a05;border-color:var(--gold);font-weight:600}
.pills{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;flex:none}.pills::-webkit-scrollbar{display:none}
.feed{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 12px 10px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:86%;padding:8px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);align-self:flex-start;word-wrap:break-word;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:#3a2f12;border-color:#5b4a1c}
.msg .who{font-size:12px;color:var(--vio);font-weight:600;margin-bottom:1px}
.msg .when{font-size:10px;color:var(--mute);margin-left:6px;font-weight:400}
.msg.roll{background:#1d2433;border-color:#31405e}
.msg.roll .tot{font:700 22px var(--serif);color:var(--gold2)}
.msg.roll .dice{font-size:12px;color:var(--mute)}
.msg.ev{align-self:center;background:none;border:0;color:var(--mute);font-size:12.5px;text-align:center;padding:2px 8px;max-width:100%}
.msg.priv{border-style:dashed}
.composer{display:flex;gap:8px;padding:8px 10px calc(8px + var(--sb)*0);border-top:1px solid var(--line);background:#191626;align-items:flex-end}
.composer textarea{min-height:44px;height:44px;max-height:120px;border-radius:22px;padding:10px 14px;resize:none}
.icb{width:44px;height:44px;border-radius:50%;background:#2e2944;display:flex;align-items:center;justify-content:center;flex:none;border:1px solid var(--line)}
.icb.go{background:var(--gold);border-color:var(--gold);color:#221a05}
.icb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sheet-bg{position:fixed;inset:0;background:rgba(8,6,14,.66);z-index:20;display:flex;align-items:flex-end}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:0;width:100%;max-height:92%;display:flex;flex-direction:column}
.sheet .sh{padding:14px 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.sheet .sh h2{flex:1;font-size:18px}
.sheet .sbody{padding:14px 16px calc(18px + var(--sb));overflow-y:auto;-webkit-overflow-scrolling:touch}
.x{width:36px;height:36px;border-radius:50%;background:#2e2944;font-size:18px;color:var(--mute)}
.stat{background:#1a1727;border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.stat b{display:block;font:700 21px var(--serif)}
.stat span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.stat small{display:block;font-size:11px;color:var(--mute);margin-top:2px;line-height:1.25}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #2b2640;font-size:14.5px}.kv:last-child{border:0}
.kv span:first-child{color:var(--mute)}.kv span:last-child{text-align:right}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #2b2640}.li:last-child{border:0}
.li .t{flex:1;min-width:0}.li .t small{display:block;color:var(--mute);font-size:12.5px}
.bar{height:8px;border-radius:9px;background:#16131f;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bar.hp i{background:linear-gradient(90deg,#d9534f,#5fd39a)}
.step{display:flex;align-items:center;gap:6px}.step button{width:40px;height:40px;border-radius:10px;background:#2e2944;border:1px solid var(--line);font-size:20px}
.step b{min-width:44px;text-align:center;font:700 20px var(--serif)}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.die{background:#2e2944;border:1px solid var(--line);border-radius:14px;padding:14px 0;font:700 17px var(--serif)}
.die.on{background:var(--gold);color:#221a05;border-color:var(--gold)}
.toast{position:fixed;left:50%;top:calc(var(--st) + 14px);transform:translateX(-50%);background:#2e2944;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:12px;z-index:50;max-width:90%;font-size:14.5px;box-shadow:0 8px 30px #000a}
.toast.err{border-color:var(--red)}
.center{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--st) + 24px) 22px 30px;overflow-y:auto}
.hero{text-align:center;margin-bottom:22px}.hero svg{width:74px;height:74px}.hero h1{font-size:32px;margin-top:8px}.hero p{color:var(--mute);margin:6px 0 0}
.code{font:700 26px ui-monospace,Menlo,monospace;letter-spacing:5px;color:var(--gold)}
details{border-top:1px solid #2b2640;padding:9px 0}details:first-of-type{border:0}summary{font-weight:600;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}summary:after{content:"+";float:right;color:var(--mute)}details[open] summary:after{content:"–"}
details p,details ul{margin:6px 0 0;color:#d6cfe6;font-size:14.5px}ul{padding-left:18px}li{margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid #2b2640;text-align:center}th{color:var(--mute);font-weight:500}td:first-child,th:first-child{text-align:left}
.av{width:44px;height:44px;border-radius:50%;overflow:hidden;background:#2e2944;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;flex:none;font:700 16px var(--serif);color:var(--gold);padding:0}.av.big{width:76px;height:76px;font-size:26px}.av img{width:100%;height:100%;object-fit:cover;display:block}
.sesbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#221d33;border-bottom:1px solid var(--line)}.sesbar small{display:block;color:var(--mute);font-size:12px}.sesbar.live{background:#1d2a24;border-bottom-color:#2f5a45}.sesbar.live b{color:var(--green)}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:#2e2944;color:var(--mute);margin-left:6px}
.tag.dm{background:#3a2f12;color:var(--gold)}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.warn{background:#3a2a12;border:1px solid #6b4d16;color:#ffd98a;border-radius:10px;padding:9px 12px;font-size:13.5px;margin:8px 0}
@media (min-width:700px){#app{max-width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);width:100%}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script src="rules.js"></script>
<script src="rules_basic.js"></script>
<script src="rules_basic_dm.js"></script>
<script src="app.js"></script>
</body>
</html>
